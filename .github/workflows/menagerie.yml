name: Menagerie

on:
  push:
    paths:
      - "Menagerie/**"
      - ".github/workflows/menagerie.yml"
  pull_request:
    paths:
      - "Menagerie/**"
      - ".github/workflows/menagerie.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: menagerie-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Menagerie

jobs:
  engines-linux:
    name: Engines on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test every engine
        run: swift test --parallel

  app-macos:
    name: App on macOS (${{ matrix.xcode }} Xcode)
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        xcode: [default, newest]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          if [[ "${{ matrix.xcode }}" == "newest" ]]; then
            XCODE="$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -1)"
            sudo xcode-select --switch "$XCODE/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Test engines
        run: swift test --parallel

      - name: Build the app bundle
        run: Scripts/build-app.sh --universal

      - name: Install with a Desktop shortcut
        run: |
          Scripts/install.sh --universal
          test -L "$HOME/Desktop/Menagerie"
          test -x "$HOME/Desktop/Menagerie/Contents/MacOS/Menagerie"
          codesign --verify --strict "$HOME/Applications/Menagerie.app"
          Scripts/install.sh --universal
          test ! -e "$HOME/Applications/Menagerie.app/Menagerie.app"

      - name: Verify Metal shaders
        run: ./build/Menagerie.app/Contents/MacOS/Menagerie --verify-shaders

      - name: Tour the app and capture screenshots
        run: |
          mkdir -p build/screenshots
          ./build/Menagerie.app/Contents/MacOS/Menagerie --capture "$PWD/build/screenshots" --dwell 5 &
          APP_PID=$!
          for _ in $(seq 1 150); do
            kill -0 "$APP_PID" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "::error::The app did not finish its capture tour in time"
            kill "$APP_PID"
            exit 1
          fi
          wait "$APP_PID"
          cp build/AppIcon.iconset/icon_512x512@2x.png build/screenshots/app-icon.png
          ls -la build/screenshots

      - name: Package the app
        run: |
          ditto -c -k --keepParent build/Menagerie.app build/Menagerie.zip
          file build/Menagerie.app/Contents/MacOS/Menagerie

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: Menagerie-app-${{ matrix.xcode }}-xcode
          path: Menagerie/build/Menagerie.zip
          if-no-files-found: error

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.xcode }}-xcode
          path: Menagerie/build/screenshots
          if-no-files-found: warn

      # The one-line setup a person runs on their Mac, end to end and in a
      # terminal: download the script from GitHub, clone into a fresh folder,
      # build, install, add the Desktop shortcut and open Claude Code. With no
      # account signed in, Claude Code stops at its first screen (the theme
      # picker), which is far enough to show it can read the terminal.
      - name: One-line Mac setup (curl | bash)
        if: matrix.xcode == 'newest' && github.event_name == 'push'
        env:
          SETUP_URL: https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/${{ github.ref_name }}/Menagerie/Scripts/setup-mac.sh
          MENAGERIE_BRANCH: ${{ github.ref_name }}
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          rm -rf "$HOME/Desktop/Menagerie" "$HOME/Applications/Menagerie.app"
          cat > "$RUNNER_TEMP/first-screen.exp" <<'EOF'
          # expect first-screen.exp <command>: runs the command in a terminal
          # and passes once Claude Code shows its first screen and keeps running.
          set timeout 900
          match_max 100000
          spawn bash -c [lindex $argv 0]
          expect {
            -re {kqueue|EINVAL} { puts "\n>>> Claude Code crashed reading the terminal"; exit 1 }
            -ex {/theme} {}
            timeout { puts "\n>>> Claude Code never started"; exit 1 }
            eof { puts "\n>>> It ended before Claude Code started"; exit 1 }
          }
          set timeout 10
          expect {
            -re {kqueue|EINVAL} { puts "\n>>> Claude Code crashed reading the terminal"; exit 1 }
            eof { puts "\n>>> Claude Code quit by itself"; exit 1 }
            timeout { puts "\n>>> Claude Code is running and waiting for sign-in"; exit 0 }
          }
          EOF
          echo "::group::For comparison: Claude Code reading /dev/tty, as the script once had it do"
          expect "$RUNNER_TEMP/first-screen.exp" "$HOME/.local/bin/claude </dev/tty" || true
          echo "::endgroup::"
          MENAGERIE_DIR="$RUNNER_TEMP/fresh-clone" expect "$RUNNER_TEMP/first-screen.exp" "curl -fsSL '$SETUP_URL' | bash"
          test -d "$RUNNER_TEMP/fresh-clone/Menagerie/build/Menagerie.app"
          test -L "$HOME/Desktop/Menagerie"
          codesign --verify --strict "$HOME/Applications/Menagerie.app"
